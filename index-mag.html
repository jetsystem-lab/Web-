<style>
:root{
  --navy:#243B82; --paper:#F3EFE6; --paper2:#EAE4D7; --ink:#17213D; --line:rgba(36,59,130,.18);
  --muted:rgba(23,33,61,.74); --accent:#C56A3E; --spine:34px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif}
body{min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
.app{width:100%;min-height:100vh;background:var(--paper)}
.page{min-height:100vh;position:relative;overflow:hidden;animation:pagein .32s cubic-bezier(.22,.7,.2,1) both}
@keyframes pagein{from{opacity:0}to{opacity:1}}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(36,59,130,.13) .6px,transparent .7px);background-size:5px 5px;mix-blend-mode:multiply}
.loading{min-height:100vh;display:grid;place-items:center;font-family:"Noto Serif JP",serif;letter-spacing:.2em;color:var(--navy)}
.notice{position:relative;z-index:60;background:var(--accent);color:#fff;font-size:12px;padding:8px 16px;text-align:center}

/* ---------- global ---------- */
.kicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:10px}
.kicker:before{content:"";display:inline-block;width:38px;height:1px;background:currentColor;flex:0 0 auto}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700}
.serif{font-family:"Noto Serif JP",serif}
.nomb{font-variant-numeric:tabular-nums;letter-spacing:.18em;font-size:10.5px}
.spine{position:fixed;z-index:50;top:0;right:0;width:var(--spine);height:100vh;background:var(--navy);color:var(--paper);display:flex;align-items:center;justify-content:center;pointer-events:none}
.spine:before{content:"";position:absolute;left:0;right:0;top:0;height:72px;background:var(--accent)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;letter-spacing:.28em;white-space:nowrap;opacity:.92}
.topnav{position:fixed;z-index:40;top:0;left:0;right:var(--spine);height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 0 18px;border-bottom:1px solid rgba(255,255,255,.18);color:#fff}
.topnav.light{color:var(--navy);border-color:rgba(36,59,130,.16);background:rgba(243,239,230,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand-mini{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700;letter-spacing:.14em;font-size:12px}
.brand-mini .logo{flex:0 0 auto;background:var(--paper);padding:4px 7px;line-height:0}
.brand-mini .logo img{height:20px;width:auto}
.brand-mini .here{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Noto Serif JP",serif;letter-spacing:.06em}
.nav-actions{display:flex;gap:8px;flex:0 0 auto}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid currentColor;background:transparent;padding:0 16px;font-size:12.5px;letter-spacing:.06em;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s,background .15s,color .15s}
.btn.fill{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.paper{background:rgba(10,18,38,.28);color:#fff;border-color:rgba(255,255,255,.85)}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.toc-item:focus-visible,.issue-tab:focus-visible,.link-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- cover ---------- */
.cover{background:var(--navy);color:#fff;min-height:100svh;display:flex;flex-direction:column}
.cover-media{position:absolute;inset:0;background:#151a2c;overflow:hidden}
.cover-media img,.cover-media video{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.03)}
.cover-media video{z-index:1}.cover-media img{z-index:0}
.cover-media:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(7,14,32,.42) 0%,rgba(7,14,32,.5) 40%,rgba(7,14,32,.92) 100%)}
/* 表紙本文と号の棚は「上下に積む」。棚を絶対配置で重ねないので、ボタンを覆うことがない */
.cover-inner{position:relative;z-index:3;flex:1 0 auto;min-height:calc(100svh - 150px);display:flex;flex-direction:column;padding:82px 58px 30px 24px}
.cover-meta{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.issue{font-size:11px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.65);padding-bottom:8px}
.issue strong{font-size:18px;display:block;letter-spacing:.08em;margin-bottom:2px}
.cover-copy{margin-top:auto;max-width:840px;padding-top:40px}
.cover-copy .kicker{opacity:.95}
.cover-title{font-family:"Noto Serif JP",serif;font-weight:700;font-size:clamp(46px,12vw,118px);line-height:1;letter-spacing:-.05em;margin:18px 0 18px;text-shadow:0 2px 24px rgba(7,14,32,.45)}
.cover-dek{font-size:clamp(16px,2.8vw,24px);line-height:1.8;max-width:780px;text-shadow:0 1px 10px rgba(7,14,32,.6)}
.cover-bottom{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:30px}
.cover-note{font-size:12.5px;line-height:1.85;max-width:560px;text-shadow:0 1px 8px rgba(7,14,32,.7)}
.cover-cta{display:flex;gap:10px;flex-wrap:wrap}
.cover-shelf{position:relative;z-index:3;flex:0 0 auto;padding:14px 58px calc(14px + env(safe-area-inset-bottom)) 24px;background:linear-gradient(to bottom,rgba(8,14,34,.55),rgba(8,14,34,.82));border-top:1px solid rgba(255,255,255,.28)}
.issue-shelf-label{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.issue-shelf-label .hint{letter-spacing:.06em;text-transform:none;opacity:.8}
.cover-issues{display:flex;gap:8px;overflow-x:auto;padding:0 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cover-issues::-webkit-scrollbar{display:none}
.issue-tab{flex:0 0 auto;border:1px solid rgba(243,239,230,.3);background:rgba(10,18,38,.4);color:#fff;padding:9px 13px 10px;min-width:112px;min-height:60px;border-bottom:3px solid transparent;cursor:pointer;text-align:left;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.issue-tab .ivol{display:block;font-family:"Noto Serif JP",serif;font-size:17px;line-height:1;margin-bottom:5px;letter-spacing:.03em}
.issue-tab .iname{display:block;font-size:11px;letter-spacing:.1em}
.issue-tab.active{background:rgba(243,239,230,.18);border-bottom-color:var(--accent)}

/* ---------- contents ---------- */
.contents{background:var(--paper);padding:92px 58px 80px 24px}
.contents-backbar{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.contents-back{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);font-size:12.5px;letter-spacing:.06em;font-weight:700;cursor:pointer}
.contents-back strong{font-family:"Noto Serif JP",serif;font-size:18px}
.contents-current{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.contents-current b{color:var(--accent)}
.contents-grid{display:grid;grid-template-columns:1.05fr 1.65fr;gap:48px;max-width:1180px;margin:0 auto;position:relative;z-index:1}
.contents-intro{padding:40px 0 20px}
.contents-title{font-size:clamp(60px,10vw,112px);line-height:.9;margin:14px 0 20px;letter-spacing:-.05em;color:var(--navy)}
.contents-lede{font-family:"Noto Serif JP",serif;font-size:18px;line-height:1.85;max-width:380px}
.issue-summary{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;font-size:12.5px;line-height:1.7}
.issue-summary .vol{font-size:34px;font-family:"Noto Serif JP",serif;color:var(--accent);line-height:1}
.contents-list{padding:18px 0 0}
.toc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.toc-list{border-top:1px solid var(--ink)}
.toc-item{display:grid;grid-template-columns:52px 104px minmax(0,1fr) 44px;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.18s transform,.18s background;align-items:center;text-decoration:none;color:inherit}
.toc-item:hover{transform:translateX(6px);background:rgba(36,59,130,.035)}
.toc-thumb{width:104px;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper2)}
.toc-p{font-family:"Noto Serif JP",serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.toc-name{font-family:"Noto Serif JP",serif;font-size:clamp(17px,2.6vw,24px);font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.toc-short{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toc-cat{justify-self:end;font-size:10.5px;writing-mode:vertical-rl;letter-spacing:.1em;color:var(--muted);max-height:96px;overflow:hidden}
.editor-note{margin-top:32px;border:1px solid var(--ink);padding:20px 18px 22px;position:relative}
.editor-note:before{content:"編集部より";position:absolute;top:-10px;left:14px;padding:0 8px;background:var(--paper);font-size:11px;letter-spacing:.14em}
.editor-note h3{font-family:"Noto Serif JP",serif;font-size:22px;line-height:1.5;margin:6px 0 10px}
.editor-note p{font-size:13px;line-height:1.9;margin:0;max-width:580px}
.page-nav{max-width:1180px;margin:44px auto 0;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.page-nav .btn{flex:1 1 200px;min-height:50px;color:var(--navy)}
.page-nav .btn.fill{color:#fff}

/* ---------- magazine spread ---------- */
.spread{padding:90px 58px 80px 24px;background:var(--paper)}
.spread-wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.section-opener{min-height:70svh;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:18px 0 54px;border-bottom:1px solid var(--ink);position:relative}
.section-opener .ghost{position:absolute;right:6%;top:12%;font-size:clamp(90px,17vw,230px);font-family:"Noto Serif JP",serif;font-weight:700;color:rgba(36,59,130,.06);line-height:.8;pointer-events:none;white-space:nowrap}
.opener-main{position:relative;z-index:2}
.opener-title{font-family:"Noto Serif JP",serif;font-size:clamp(66px,12vw,150px);line-height:.9;letter-spacing:-.06em;margin:18px 0 26px}
.opener-sub{font-size:13.5px;line-height:1.9;max-width:540px}
.opener-side{writing-mode:vertical-rl;font-size:10.5px;letter-spacing:.2em;border-left:1px solid var(--ink);padding-left:12px}
.article-layout{padding-top:48px}
.cat-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:56px 0 0;padding-top:14px;border-top:3px solid var(--accent)}
.cat-head:first-child{margin-top:0}
.cat-head h2{font-family:"Noto Serif JP",serif;font-size:clamp(28px,5vw,44px);margin:0;line-height:1.2}
.cat-head .n{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.story-link{text-decoration:none;color:inherit;display:block}
.hero-story{position:relative;display:grid;grid-template-columns:1.35fr .8fr;min-height:64svh;margin-top:22px}
.hero-photo{min-height:460px;position:relative;overflow:hidden;background:var(--paper2)}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.04)}
.hero-caption{position:absolute;left:18px;bottom:16px;background:var(--paper);padding:8px 10px;font-size:11.5px;line-height:1.5;max-width:75%}
.hero-copy{padding:36px 24px 30px 42px;display:flex;flex-direction:column;justify-content:flex-end;border-top:1px solid var(--ink);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.hero-copy h2{font-family:"Noto Serif JP",serif;font-size:clamp(32px,4.6vw,58px);line-height:1.12;letter-spacing:-.04em;margin:12px 0 18px;overflow-wrap:anywhere}
.hero-copy p{font-size:13.5px;line-height:1.95;margin:0 0 22px;max-width:440px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.read-more{font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-top:1px solid var(--ink);padding-top:12px;min-height:44px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.read-more span:last-child{font-size:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:40px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.duo-card{padding:28px 24px 30px 0;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:12px}
.duo .story-link+.story-link .duo-card{border-left:1px solid var(--ink);padding-left:24px}

<body>
<div class="app" id="app"><div class="loading">読み込み中 ……</div></div>
<script>
/* ============================================================
   データ取得（gviz方式）
   シートは 1行目＝英字キー／2行目＝日本語見出し の二段構成。
   headers=0 で全行を受け取り、1行目をキーとして読む。
   ============================================================ */
const KEYS = ["name","category","industries","short","long","image","video","pdf","web"];

async function loadData(){
  if(!SHEET_ID) return { items: DEMO.slice(), demo:true };
  try{
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
                "/gviz/tq?tqx=out:json&headers=0&sheet=" + encodeURIComponent(SHEET_NAME);
    const text = await (await fetch(url, {cache:"no-store"})).text();
    const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
    const rows = json.table.rows || [];
    if(!rows.length) return { items: DEMO.slice(), demo:true };
    const head = (rows[0].c || []).map(c => (c && c.v != null ? String(c.v).trim().toLowerCase() : ""));
    const idx = {};
    KEYS.forEach(k => { idx[k] = head.indexOf(k); });
    if(idx.name < 0) return { items: DEMO.slice(), demo:true };
    const items = rows.slice(1).map(r => {
      const o = {};
      KEYS.forEach(k => {
        const c = (idx[k] >= 0 && r.c) ? r.c[idx[k]] : null;
        o[k] = c && c.v != null ? String(c.v).trim() : "";
      });
      return o;
    }).filter(o => o.name && KEYS.indexOf(o.name.toLowerCase()) < 0 && o.name !== "商材名");
    if(!items.length) return { items: DEMO.slice(), demo:true };
    return { items, demo:false };
  }catch(e){
    console.warn("loadData failed", e);
    return { items: DEMO.slice(), demo:true };
  }
}

/* pdf 列：「ラベル|URL」を改行区切りで複数 */
function parsePdfs(raw){
  if(!raw) return [];
  return String(raw).split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(line => {
    const i = line.indexOf("|");
    if(i < 0) return { label:"資料PDF", url:line };
    return { label:line.slice(0,i).trim() || "資料PDF", url:line.slice(i+1).trim() };
  }).filter(p => p.url);
}

/* 画像URL整形：Googleドライブ共有リンク → lh3、その他は weserv プロキシ */
function imgURL(src, w){
  if(!src) return "";
  w = w || 1200;
  const m = String(src).match(/[-\w]{25,}/);
  if(/drive\.google\.com|docs\.google\.com/.test(src) && m){
    return "https://lh3.googleusercontent.com/d/" + m[0] + "=w" + w;
  }
  if(/^https?:\/\//.test(src)){
    return "https://images.weserv.nl/?url=" + encodeURIComponent(src.replace(/^https?:\/\//,"")) + "&w=" + w + "&output=jpg&q=78";
  }
  return src;
}

/* YouTube URL から動画IDを取り出す */
function ytId(u){
  if(!u) return "";
  const m = String(u).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : "";
}

/* 商材の写真：image → カテゴリ別写真 → 既定写真 */
function photoFor(item, w){
  if(item.image) return imgURL(item.image, w);
  return fallbackPhoto(item, w);
}
function fallbackPhoto(item, w){
  const cat = item.category || "";
  for(const k in CAT_PHOTO){
    if(CAT_PHOTO[k] && (cat === k || cat.indexOf(k) >= 0)) return imgURL(CAT_PHOTO[k], w);
  }
  return imgURL(DEFAULT_PHOTO, w);
}
/* 商材画像の <img>。読み込み失敗時の差し替え先（カテゴリ写真）を data-fb に持たせる */
function pimg(item, w, extra){
  return '<img src="' + esc(photoFor(item, w)) + '" data-fb="' + esc(fallbackPhoto(item, w)) + '" alt="" ' + (extra || 'loading="lazy"') + '>';
}
/* Googleドライブの画像は、一度に大量に要求すると一時的に拒否されることがある。
   失敗したら少し待って最大2回まで読み直し、それでもダメならカテゴリ写真に差し替える */
document.addEventListener("error", e => {
  const img = e.target;
  if(!(img instanceof HTMLImageElement)) return;
  const tries = +(img.dataset.try || 0), src = img.getAttribute("src");
  if(tries < 2 && /googleusercontent\.com/.test(src)){
    img.dataset.try = tries + 1;
    setTimeout(() => { img.removeAttribute("src"); img.setAttribute("src", src); }, 900 * (tries + 1) + Math.random() * 900);
    return;
  }
  if(img.dataset.fb && src !== img.dataset.fb) img.setAttribute("src", img.dataset.fb);
}, true);

function industryProducts(ind){

    if(!s) return true;
    return s.split(/[,、\n\/]+/).map(x => x.trim()).filter(Boolean).indexOf(ind.label) >= 0;

/* ============================================================
   ルーティング（URLの # に現在地を持たせる）
   → スマホの「戻る」ジェスチャーで 記事→目次→表紙 と戻れる
   → 業種ごとのQRコード（例：…/index-mag.html#vol-05）で、その号の表紙を直接ひらける
   ============================================================ */
function hashFor(view, ind, n){
  ind = ind || state.ind;
  const v = "#vol-" + pad2(INDUSTRIES.indexOf(ind) + 1);
  if(view === "cover")    return v;
  if(view === "contents") return v + "/contents";
  if(view === "spread")   return v + "/spread";
  if(view === "scene")    return v + "/scene" + (state.zone ? "/z-" + state.zone : "");
  return v + "/p-" + pad2((n == null ? state.article : n) + 1);
}
function parseHash(){
  const seg = decodeURIComponent(location.hash).replace(/^#/, "").split("/").filter(Boolean);
  const m = (seg[0] || "").match(/^vol-(\d{1,2})$/);
  if(!m) return { view:"cover", ind:INDUSTRIES[0] };
  const ind = INDUSTRIES[+m[1] - 1] || INDUSTRIES[0];
  if(!seg[1]) return { view:"cover", ind };
  if(seg[1] === "contents" || seg[1] === "spread") return { view:seg[1], ind };
  if(seg[1] === "scene") return { view:"scene", ind, zone:(seg[2] || "").replace(/^z-/, "") || null };
  const p = seg[1].match(/^p-(\d+)$/);
  if(p) return { view:"article", ind, n:+p[1] - 1 };
  return { view:"cover", ind };
}
function go(view, n, replace){
  if(typeof n === "number") state.article = n;
  const h = hashFor(view);
  if(location.hash !== h) history[replace ? "replaceState" : "pushState"](null, "", h);
  state.view = view;
  render();
}
function applyHash(){
  const r = parseHash();
  setIssue(r.ind);
  state.view = r.view;
  state.zone = r.zone || null;
  if(r.view === "scene" && !SCENES[r.ind.label]) state.view = "contents";
  if(r.view === "article"){
    if(r.n >= 0 && r.n < state.list.length) state.article = r.n;
    else state.view = "contents";
  }
  render();
}
addEventListener("popstate", applyHash);

/* 画面遷移用の関数名はプロトタイプのものを踏襲 */

  state.zone = id || null;

  '</section>';
}

/* 誌面：カテゴリごとに見出しを立て、各カテゴリの1本目を大きく、以降を2段・見開き・行組みで緩急をつける */
function renderSpread(){
  const ind = state.ind, list = state.list;
  if(!list.length) return renderContents();
  const at = p => list.indexOf(p);
  const link = (p, inner, cls) => '<a class="story-link ' + (cls || "") + '" href="' + hashFor("article", ind, at(p)) + '" onclick="event.preventDefault();openArticle(' + at(p) + ')">' + inner + '</a>';
  const groups = [], seen = {};
  list.forEach(p => { const c = p.category || "その他"; if(!seen[c]){ seen[c] = []; groups.push(c); } seen[c].push(p); });

  let body = "", bandNo = 0;
  groups.forEach((cat, gi) => {
    const items = seen[cat];
    body += '<div class="cat-head"><h2>' + esc(cat) + '</h2><span class="n">' + items.length + ' 本の記事</span></div>';
    const [lead, ...rest] = items;
    body += link(lead,
      '<section class="hero-story"><div class="hero-photo">' + pimg(lead, 1400) +
        '<div class="hero-caption">▲ ' + esc(lead.category || indName(ind)) + '</div></div>' +
      '<div class="hero-copy"><div class="eyebrow">P.' + pad2(at(lead) + 1) + ' / ' + (gi === 0 ? 'LEAD STORY' : 'FEATURE') + '</div>' +
        '<h2>' + esc(lead.name) + '</h2><p>' + esc(lead.short || lead.long || "") + '</p>' +
        '<div class="read-more"><span>記事を読む</span><span>↗</span></div></div></section>');
    let k = 0;
    while(k < rest.length){
      const left = rest.length - k;
      if(left >= 2 && (k === 0 || left !== 3)){
        const pair = rest.slice(k, k + 2);
        body += '<section class="duo">' + pair.map(p => link(p,
          '<article class="duo-card"><div class="eyebrow">P.' + pad2(at(p) + 1) + ' / ' + esc(p.category || "FEATURE") + '</div>' +
          pimg(p, 900) + '<h3>' + esc(p.name) + '</h3><p>' + esc(p.short || p.long || "") + '</p>' +
          '<div class="read-more"><span>記事を読む</span><span>↗</span></div></article>')).join("") + '</section>';
        k += 2;
      }else if(left === 1 || left === 3){
        const p = rest[k];
        body += link(p,
          '<section class="spread-story"><div class="big-photo">' + pimg(p, 1200) + '</div>' +
          '<div class="spread-copy"><div class="eyebrow">P.' + pad2(at(p) + 1) + ' / EDITORIAL</div>' +
          '<h3><span class="drop">' + esc((p.name || "").slice(0, 1)) + '</span>' + esc((p.name || "").slice(1)) + '</h3>' +
          '<p>' + esc(p.short || p.long || "") + '</p><div class="read-more" style="margin-top:24px"><span>記事を読む</span><span>↗</span></div></div></section>');
        k += 1;
      }
    }
    if(gi % 2 === 0 && gi < groups.length - 1){
      bandNo++;
      body += '<section class="band"><div class="band-num">' + pad2(bandNo) + '</div><div>' +
        '<h3>現場の一手は、設備だけでは決まらない。</h3>' +
        '<p>単品の導入ではなく、日々の動線を一枚の設計図として考える。いまの運用や周辺機器とのつながりまで含めて、使い続けられる形をご提案します。</p></div></section>';
    }
  });

  return spineHTML() +
  '<div class="topnav light">' + brandHTML(volOf(ind) + " " + indName(ind) + "特集号") +
    '<div class="nav-actions"><button class="btn" onclick="showContents()">← 目次</button><button class="btn fill" onclick="showCover()">表紙</button></div></div>' +
  '<section class="page spread"><div class="spread-wrap">' +
    '<section class="section-opener"><div class="ghost" aria-hidden="true">' + esc(ind.en) + '</div>' +
      industryArt(ind, "opener-art") +
      '<div class="opener-main"><div class="kicker">FEATURE / ' + volOf(ind) + '</div>' +
        '<h1 class="opener-title">' + esc(indName(ind)) + '<br><span style="color:' + ind.color + '">特集号</span></h1>' +
        '<div class="opener-sub">' + esc(ind.sub) + '<br>' + list.length + ' 本の記事を、カテゴリごとにまとめました。写真をタップすると記事がひらきます。</div></div>' +
      '<div class="opener-side">JET SYSTEM / INDUSTRY CATALOG / ' + volOf(ind) + '</div></section>' +
    '<div class="article-layout">' + body + '</div>' +
    '<div class="page-nav"><button class="btn" onclick="showContents()">← 目次に戻る</button><button class="btn" onclick="showCover()">表紙に戻る</button></div>' +
  '</div></section>';
}

/* ============================================================
   現場で見る ── アイソメ図
   ------------------------------------------------------------
   grid(x,y,z) を斜め投影して描く。x は右下、y は左下、z は高さ。
   ピンも同じ grid 座標から位置を出すので、絵と商材がズレない。
   ★ピンの商材名はスプレッドシートの name 列と完全一致させること。
     一致しない行は、そのピンだけ自動的に非表示になります。
   ============================================================ */
const ISO = { ox:560, oy:118, hw:24, hh:12, hz:30, W:1600, H:1000 };
const P = (x, y, z) => [ISO.ox + (x - y) * ISO.hw, ISO.oy + (x + y) * ISO.hh - (z || 0) * ISO.hz];
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
/* fill を渡せば色を直接、渡さなければ class（CSS）で塗る */
const fpoly = (a, fill, cls) => '<polygon' + (cls ? ' class="' + cls + '"' : '') + (fill ? ' fill="' + fill + '"' : '') + ' points="' + pts(a) + '"/>';
const f1 = v => v.toFixed(1);

/* 素材の色。[上面, 左手前の面, 右手前の面] の順で、上ほど明るく塗って立体に見せる */
const MAT = {
  wall:   ["#f7f2e8", "#ebe3d3", "#ddd2bf"],
  wood:   ["#d3a571", "#b98b58", "#a17848"],
  oak:    ["#e6cca1", "#d2b286", "#bd9c6f"],
  white:  ["#fdfcf9", "#ebe8e1", "#d8d4cb"],
  steel:  ["#e6eaed", "#ccd2d7", "#b4bcc3"],
  ink:    ["#3f475c", "#2f3547", "#242a3a"],
  mustard:["#e9b551", "#d19c3d", "#b98731"],
  teal:   ["#6aa7a1", "#548c87", "#467571"],
  coral:  ["#e58a6c", "#cc7356", "#b36248"],
  navy:   ["#4b67b3", "#3a5394", "#2f447a"],
  green:  ["#86b872", "#6d9c5b", "#5a854b"],
  water:  ["#bfe0f2", "#9fcbe4", "#87b8d6"],
  clay:   ["#c98a63", "#b0734f", "#975f40"]
};
const FLOOR = { tile:"#f1e9da", wood:"#e2c597", oak:"#ead3ab", kitchen:"#e4ebee", carpet:"#d9d5cc", walk:"#e6e0d3", stone:"#d3ccbe", road:"#8f9298" };

/* 直方体。上面・左面・右面の3枚で立体に見せる。m は MAT の素材名か "hot"（当社商材の色） */
function box(x, y, w, d, h, m, z){
  z = z || 0; const t = z + h, c = MAT[m];
  const face = (a, i, cl) => c ? fpoly(a, c[i]) : fpoly(a, "", (m || "") + " " + cl);
  return face([P(x,y+d,t), P(x+w,y+d,t), P(x+w,y+d,z), P(x,y+d,z)], 1, "fl") +
         face([P(x+w,y,t), P(x+w,y+d,t), P(x+w,y+d,z), P(x+w,y,z)], 2, "fr") +
         face([P(x,y,t), P(x+w,y,t), P(x+w,y+d,t), P(x,y+d,t)], 0, "ft");
}
const plate = (x, y, w, d, f) => fpoly([P(x,y,0), P(x+w,y,0), P(x+w,y+d,0), P(x,y+d,0)], FLOOR[f] || FLOOR.tile);
const line2 = (a, b, cls) => '<line class="' + (cls || "ln") + '" x1="' + f1(a[0]) + '" y1="' + f1(a[1]) + '" x2="' + f1(b[0]) + '" y2="' + f1(b[1]) + '"/>';
/* 床の目地。dir="x" は横目地だけ（板張り）、"xy" は格子（タイル） */
function seams(x, y, w, d, step, dir){
  let s = "";
  for (let v = y + step; v < y + d - .01; v += step) s += line2(P(x, v, 0), P(x + w, v, 0), "seam");
  if (dir === "xy") for (let v = x + step; v < x + w - .01; v += step) s += line2(P(v, y, 0), P(v, y + d, 0), "seam");
  return s;
}
/* 面に貼る板（画面・看板・のれんなど）。panY は y が一定の面（左手前向き）、panX は x が一定の面（右手前向き） */
const panY = (x0, x1, y, z0, z1, cls, fill) => fpoly([P(x0,y,z1), P(x1,y,z1), P(x1,y,z0), P(x0,y,z0)], fill, cls);
const panX = (x, y0, y1, z0, z1, cls, fill) => fpoly([P(x,y0,z1), P(x,y1,z1), P(x,y1,z0), P(x,y0,z0)], fill, cls);
const topPan = (x, y, w, d, z, cls, fill) => fpoly([P(x,y,z), P(x+w,y,z), P(x+w,y+d,z), P(x,y+d,z)], fill, cls);
/* 水平に置いた丸（お皿・コンロなど） */
const dot = (x, y, z, r, fill) => { const p = P(x, y, z); return '<ellipse cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" rx="' + r + '" ry="' + (r / 2) + '" fill="' + fill + '"/>'; };
const ball = (p, r, fill) => '<circle cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + r + '" fill="' + fill + '"/>';
/* 面に沿って書く文字（看板用） */
const txtY = (s, x, y, z, size, fill) => { const p = P(x, y, z); return '<text class="sg" font-size="' + size + '" fill="' + fill + '" transform="matrix(.894 .447 0 1 ' + f1(p[0]) + ' ' + f1(p[1]) + ')">' + s + '</text>'; };
const txtX = (s, x, y, z, size, fill) => { const p = P(x, y, z); return '<text class="sg" font-size="' + size + '" fill="' + fill + '" transform="matrix(.894 -.447 0 1 ' + f1(p[0]) + ' ' + f1(p[1]) + ')">' + s + '</text>'; };

/* 人物。m は服の色（店員は navy、調理は white） */
function person(x, y, m){
  const h = P(x, y, 1.05), cy = h[1] - 9;
  return box(x - .22, y - .18, .44, .36, .45, "ink") +
         box(x - .3, y - .24, .6, .48, .52, m || "coral", .45) +
         ball([h[0], cy], 7.5, "#f1cfad") +
         '<path d="M' + f1(h[0] - 7.5) + ' ' + f1(cy - .5) + 'A7.5 7.5 0 0 1 ' + f1(h[0] + 7.5) + ' ' + f1(cy - .5) + 'Z" fill="#3b2e28"/>';
}
/* 胸の前で持ったスマホ（画面が光っている）。人物の (x, y) をそのまま渡す */
const phone = (x, y) => box(x + .12, y + .2, .34, .3, .12, "ink", .78) + topPan(x + .16, y + .24, .26, .22, .901, "glow");
/* テーブル＋椅子。dishes はお皿の数（端末を置く卓は減らす） */
const FOOD = ["#e58a6c", "#e9b551", "#86b872"];
function tableSet(x, y, s, m, dishes){
  s = s || 1.5; dishes = dishes == null ? 2 : dishes;
  const at = [[x + s * .8, y + s * .3], [x + s * .28, y + s * .78]].slice(0, dishes);
  return box(x - .62, y + s/2 - .3, .55, .6, .44, m || "teal") +
         box(x + s/2 - .16, y + s/2 - .16, .32, .32, .74, "wood") +
         box(x, y, s, s, .09, "oak", .74) +
         at.map((p, i) => dot(p[0], p[1], .83, 7, "#fff") + dot(p[0], p[1], .835, 3.2, FOOD[(i + Math.round(x)) % 3])).join("") +
         box(x + s + .07, y + s/2 - .3, .55, .6, .44, m || "teal");
}
/* 鉢植え・街路樹 */
function plant(x, y){
  const c = P(x, y, .95);
  return box(x - .25, y - .25, .5, .5, .45, "clay") + ball([c[0], c[1]], 11, "#79ad66") + ball([c[0] - 3, c[1] - 4], 6, "#93c47e");
}
function tree(x, y){
  const c = P(x, y, 2.1);
  return box(x - .1, y - .1, .2, .2, 1.5, "clay") + ball([c[0], c[1]], 20, "#79ad66") + ball([c[0] - 7, c[1] - 7], 11, "#93c47e");
}
/* 鍋から立つ湯気 */
const steam = (x, y, z) => { const p = P(x, y, z); return '<path class="steam" d="M' + f1(p[0]) + ' ' + f1(p[1]) + 'c5 -6 -5 -10 0 -17c5 -6 -5 -10 0 -17"/>'; };
const rep = (n, f) => { let s = ""; for(let i = 0; i < n; i++) s += f(i); return s; };

/* 飲食号の誌面図：フードコート／客席（回転ずし・テーブル）／レジ／厨房／バックヤード／店外 */
function sceneFood(){
  const Z = [];
  /* b = 全体図でゾーンバッジを立てる位置。重ならないよう手で散らしてある */
  const z = (id, name, en, x, y, w, d, b, svg, pins) => { Z.push({id, name, en, x, y, w, d, b, svg, pins}); };

  /* ① フードコート・店頭 */
  z("ent", "フードコート・店頭", "FOOD COURT", 2, 1, 14, 10, [7, 1.6, 2.5],
    plate(2,1,14,10,"tile") + seams(2,1,14,10,1,"xy") +
    box(2,1,14,.35,2.6,"wall") + box(2,1,.35,10,2.6,"wall") +
    /* 受け渡しカウンターの上のメニュー板 */
    panY(10.3,15.1,1.36,1.62,2.42,"","#2f3547") + txtY("MENU",10.5,1.37,1.92,10,"#f3efe6") +
    rep(3, i => panY(12.05 + i*1.0, 12.85 + i*1.0, 1.37, 1.74, 2.28, "", FOOD[i])) +
    /* 機械は奥の壁と左の壁に振り分ける（一列に並べると、スマホでピンが重なるため）。
       白い本体＋紺の画面＋当社色の帯で「機械」と分かるようにする */
    box(4.6,1.5,1.1,.9,1.83,"white") + box(4.6,1.5,1.1,.9,.12,"hot",1.83) +          /* 券売機（GLORY）… 奥の壁 */
    panY(4.75,5.55,2.41,1.12,1.68,"scr") + panY(4.8,5.5,2.41,.5,.72,"","#c9c5bc") +
    box(7.6,1.5,1.1,.9,1.83,"white") + box(7.6,1.5,1.1,.9,.12,"hot",1.83) +          /* 券売機（芝浦）… 奥の壁 */
    panY(7.75,8.55,2.41,1.12,1.68,"scr") + panY(7.8,8.5,2.41,.5,.72,"","#c9c5bc") +
    box(2.4,3.2,.9,1.05,1.83,"white") + box(2.4,3.2,.9,1.05,.12,"hot",1.83) +        /* 券売機（フジタカ）… 左の壁 */
    panX(3.31,3.35,4.1,1.12,1.68,"scr") + panX(3.31,3.4,4.05,.5,.72,"","#c9c5bc") +
    box(2.38,5.7,.32,1.7,1.9,"ink") +                                                 /* デジタルサイネージ … 左の壁 */
    panX(2.71,5.82,7.28,1.05,1.78,"","#e58a6c") + panX(2.71,5.82,7.28,.5,1.0,"","#e9b551") +
    txtX("おすすめ",2.715,7.2,1.48,8,"#fff") +
    box(2.4,9.3,.65,.6,1.58,"white") + box(2.4,9.3,.65,.6,.12,"hot",1.58) +          /* 両替機 … 左の壁の奥 */
    panX(3.06,9.38,9.82,.95,1.38,"scr") +
    box(10,1.4,5.4,1.1,1.15,"oak") + box(10,1.4,5.4,1.1,.12,"steel",1.15) +         /* 受け渡しカウンター */
    box(13.6,1.6,.9,.6,.22,"white",1.27) +                                            /* 呼び出しベルの充電台 */
    rep(3, i => dot(13.8 + i*.25, 1.9, 1.5, 4.5, "#e9b551")) +

/* 画面上の範囲からカメラ（拡大率と移動量）を決める。
   zo を渡せばそのゾーンに寄り、渡さなければ全体を枠いっぱいに収める */
function camBox(rects, padTop, padOther, min, max){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  rects.forEach(r => {
    [P(r.x, r.y, 0), P(r.x + r.w, r.y, 0), P(r.x + r.w, r.y + r.d, 0), P(r.x, r.y + r.d, 0)].forEach(p => {
      x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]);
      y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
    });
  });
  x0 -= padOther; x1 += padOther; y0 -= padTop; y1 += padOther;
  const s = Math.max(min, Math.min(max, Math.min(ISO.W / (x1 - x0), ISO.H / (y1 - y0))));
  return { s, tx: ISO.W / 2 - (x0 + x1) / 2 * s, ty: ISO.H / 2 - (y0 + y1) / 2 * s };
}
function camFor(zo, all){
  /* ピンが枠の外へ出ないよう、上と周囲に余白を取ってから収める */
  return zo ? camBox([zo], 185, 78, 1.1, 2.35) : camBox(all, 250, 55, .5, 1.15);
}
/* 近いピンどうしは重なるので、描いたあとに実寸を測って整える。
   ・横は「ラベルだけ」を枠内へ寄せる
   ・縦は「引き出し線を伸ばす」
   どちらも先端の点は動かさないので、指している場所はズレない */
function spreadPins(){
  const stage = document.querySelector(".stage");
  if(!stage) return;
  const items = [...stage.querySelectorAll(".pin,.zb")];
  if(!items.length) return;
  /* 何度呼んでも同じ結果になるよう、前回ずらした分をいったん戻してから測る */
  items.forEach(el => {
    const b = el.querySelector(".box"), s = el.querySelector(".stem");
    b.style.left = b.style.top = b.style.maxWidth = b.style.position = "";
    if(s) s.style.height = "";
  });
  const sr = stage.getBoundingClientRect();
  const data = items.map(el => {
    const b = el.querySelector(".box").getBoundingClientRect();
    return { box:el.querySelector(".box"), stem:el.querySelector(".stem"), up:!el.classList.contains("flip"),
             L:b.left, R:b.right, T:b.top, H:b.height };
  });

  data.forEach(o => {                                   /* 横：枠からはみ出すラベルを内側へ */
    let dx = 0;
    if(o.L < sr.left + 4) dx = sr.left + 4 - o.L;
    else if(o.R > sr.right - 4) dx = sr.right - 4 - o.R;
    if(dx){ o.box.style.left = Math.round(dx) + "px"; o.L += dx; o.R += dx; }
    /* 枠より横に長いラベルは、縮めて枠内に収める */
    if(o.R - o.L > sr.width - 8){
      o.box.style.maxWidth = Math.round(sr.width - 8) + "px";
      o.box.style.left = Math.round(sr.left + 4 - (o.L - (o.box.style.left ? parseFloat(o.box.style.left) : 0))) + "px";
      o.L = sr.left + 4; o.R = sr.right - 4;
    }
  });

  const placed = [];
  data.sort((a, b) => a.T - b.T).forEach(o => {         /* 縦：ぶつかる分だけ線を伸ばす */
    const hit = t => placed.some(p => o.L < p.right + 6 && p.left < o.R + 6 && t < p.bottom + 4 && p.top < t + o.H + 4);
    /* まず定位置から離れる向きへ、枠に当たったら逆向きへ逃がす */
    const tryDir = up => {
      let d = 0, t = o.T, g = 0;
      while(g++ < 40 && hit(t)){
        const nd = d + 13, nt = up ? o.T - nd : o.T + nd;
        if(nt < sr.top + 4 || nt + o.H > sr.bottom - 4) break;
        d = nd; t = nt;
      }
      return { d, t, ok:!hit(t) };
    };
    let r = tryDir(o.up);
    if(!r.ok){ const alt = tryDir(!o.up); if(alt.ok) r = Object.assign(alt, { flip:true }); }
    if(r.d && o.stem) o.stem.style.height = (16 + r.d) + "px";
    if(r.flip){ o.box.style.top = (o.up ? r.d * 2 : -r.d * 2) + "px"; o.box.style.position = "relative"; }
    placed.push({ left:o.L, right:o.R, top:r.t, bottom:r.t + o.H });
  });
}

/* grid座標 → 図枠に対する％。カメラを通すので、寄った後もピンが合う */
function pinPos(a, cam){
  const p = P(a[0], a[1], a[2] || 0);
  return { l: (p[0] * cam.s + cam.tx) / ISO.W * 100, t: (p[1] * cam.s + cam.ty) / ISO.H * 100 };
}

function renderScene(){
  const ind = state.ind, zones = SCENES[ind.label]();
  const have = {};
  state.list.forEach(p => { have[p.name] = state.list.indexOf(p); });
  /* ピンの名前は文字列か配列。配列なら先頭から順に、シートにある名前を採用する */
  zones.forEach(zo => {
    zo.live = zo.pins.map(q => {
      const n = [].concat(q.n).find(x => have[x] != null);
      return n == null ? null : Object.assign({}, q, { n });
    }).filter(Boolean);
  });

  const cur = zones.find(zo => zo.id === state.zone) || null;
  const cam = camFor(cur, zones);
  const shown = cur ? cur.live : [];
  /* 同じ商材を2か所に置くことがあるので、点数は商材名の種類で数える */
  const total = new Set([].concat(...zones.map(zo => zo.live.map(q => q.n)))).size;
  const rest = state.list.length - total;

  /* 全体図ではゾーンのバッジ、寄ったときは商材のピンを出す */
  const live = zones.filter(zo => zo.live.length);
  const marks = cur
    ? shown.map((q, i) => {
        const o = pinPos(q.a, cam);
        return '<button class="pin' + (o.t < 32 ? ' flip' : '') + '" style="left:' + o.l.toFixed(2) + '%;top:' + o.t.toFixed(2) + '%"' +
          ' onclick="openArticle(' + have[q.n] + ')" aria-label="' + esc(q.n) + '">' +
          '<span class="inner"><span class="box"><span class="num">' + (i + 1) + '</span><span class="nm">' + esc(q.n) + '</span></span>' +
          '<span class="stem"></span><span class="tip"></span></span></button>';
      }).join("")
    : live.map((zo, i) => {
        const o = pinPos(zo.b, cam);
        return '<button class="zb' + (o.t < 34 ? ' flip' : '') + '" style="left:' + o.l.toFixed(2) + '%;top:' + o.t.toFixed(2) + '%"' +
          ' onclick="goZone(\'' + zo.id + '\')" aria-label="' + esc(zo.name) + ' ' + zo.live.length + '点">' +
          '<span class="inner"><span class="box"><span class="num">' + (i + 1) + '</span><span class="nm">' + esc(zo.name) + '</span>' +
          '<span class="n">' + zo.live.length + '点</span></span>' +
          '<span class="stem"></span><span class="tip"></span></span></button>';
      }).join("");

  /* 図の下の一覧：全体図ならゾーン、寄っていればその場所の商材 */
  const list = cur
    ? cur.live.map((q, i) => '<a href="' + hashFor("article", ind, have[q.n]) + '" onclick="event.preventDefault();openArticle(' + have[q.n] + ')">' +
        '<span class="i">' + (i + 1) + '</span><span class="t">' + esc(q.n) + '</span>' +
        '<span class="c">' + esc(state.list[have[q.n]].category || "") + '</span></a>').join("")
    : live.map((zo, i) => '<a href="' + hashFor("scene", ind) + '" onclick="event.preventDefault();goZone(\'' + zo.id + '\')">' +
        '<span class="i">' + (i + 1) + '</span><span class="t">' + esc(zo.name) + '</span>' +
        '<span class="c">' + zo.live.length + '点 ▸</span></a>').join("");

  const chips = '<button class="' + (cur ? '' : 'on') + '" onclick="goZone(null)">全体</button>' +
    live.map((zo, i) => '<button class="' + (cur === zo ? 'on' : '') + '" onclick="goZone(\'' + zo.id + '\')">' +
      (i + 1) + ' ' + esc(zo.name) + ' ' + zo.live.length + '</button>').join("");

  const svg = '<svg class="scene-svg" viewBox="0 0 ' + ISO.W + ' ' + ISO.H + '" role="img" aria-label="' + esc(indName(ind)) + 'の現場図">' +
    '<g id="cam" style="transform:translate(' + cam.tx.toFixed(1) + 'px,' + cam.ty.toFixed(1) + 'px) scale(' + cam.s.toFixed(3) + ')">' +
    zones.map(zo => {
      const c = P(zo.x + zo.w / 2, zo.y + zo.d + .9, 0);
      return '<g class="zone' + (cur && cur !== zo ? ' dim' : '') + '" data-z="' + zo.id + '">' + zo.svg +
        '<text class="zt" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '" text-anchor="middle">' + esc(zo.name) + '</text></g>';
    }).join("") + '</g></svg>';

  return spineHTML() +
  '<div class="topnav light">' + brandHTML(volOf(ind) + " " + indName(ind) + "特集号") +
    '<div class="nav-actions"><button class="btn" onclick="showCover()">← 表紙</button><button class="btn fill" onclick="showContents()">目次</button></div></div>' +
  '<section class="page scene"><div class="scene-wrap">' +
    '<div class="scene-head"><div><div class="kicker">' + volOf(ind) + ' / ON SITE</div>' +
      '<h1>現場で見る</h1><p>' + esc(indName(ind)) + 'の現場に、当社がご提案できる商材を置いてみました。' +
      'まずは気になる場所を押してください。寄ったあと、商材を押すと記事がひらきます。</p></div>' +
      '<div class="cnt"><b>' + total + '</b>点を掲載</div></div>' +
    '<div class="stage">' + svg + '<div class="layer">' + marks + '</div>' +
      '<div class="stage-bar"><span class="now">' + (cur ? esc(cur.name) + '<span>' + cur.live.length + '点</span>' : '全体図<span>' + zones.filter(z2 => z2.live.length).length + 'か所</span>') + '</span>' +
      (cur ? '<button class="btn" onclick="goZone(null)">◻ 全体にもどる</button>' : '<span class="hint">場所を押すと寄ります</span>') +
      '</div></div>' +
    '<div class="zone-chips">' + chips + '</div>' +
    '<div class="scene-list">' + list + '</div>' +
    (rest > 0 ? '<div class="scene-rest">このほか ' + rest + ' 点は、図に描ききれないため目次と誌面に掲載しています。</div>' : '') +
    '<div class="page-nav"><button class="btn" onclick="showContents()">目次を見る →</button><button class="btn" onclick="showSpread()">誌面を読む →</button></div>' +
  '</div></section>';
}

function render(){
  const v = state.view;
  const html = v === "cover" ? renderCover() : v === "contents" ? renderContents()
             : v === "spread" ? renderSpread() : v === "scene" ? renderScene() : renderArticle();
  document.getElementById("app").innerHTML =
    (state.demo ? '<div class="notice">デモデータ表示中 ─ スプレッドシートを読み込めませんでした</div>' : '') + html;
  const p = state.list[state.article];
  document.title = (v === "article" && p ? p.name + " ─ " : "") + (v === "cover" ? "" : indName(state.ind) + "特集号 ─ ") + "ジェットシステム Webカタログ";
  if(v === "scene"){
    spreadPins();                                       /* 描画直後（位置の計算はその場で確定する） */
    if(document.fonts) document.fonts.ready.then(() => { if(state.view === "scene") spreadPins(); });  /* 文字の幅が確定したあと */
  }
  scrollTo(0, 0);
}
/* スマホの縦横回転やウィンドウの大きさが変わったら、ピンを置き直す */
let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(state.view === "scene") spreadPins(); }, 150);
});

/* 記事は左右スワイプ／矢印キーで前後へ（行き止まりでは止まる） */
addEventListener("keydown", e => {
  if(state.view !== "article") return;
  if(e.key === "ArrowRight" && state.article < state.list.length - 1) openArticle(state.article + 1);
  if(e.key === "ArrowLeft" && state.article > 0) openArticle(state.article - 1);
});
let sx = 0, sy = 0;
addEventListener("touchstart", e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, {passive:true});
addEventListener("touchend", e => {
  if(state.view !== "article") return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
  const n = state.article + (dx < 0 ? 1 : -1);
  if(n >= 0 && n < state.list.length) openArticle(n);
}, {passive:true});

(async function init(){
  const d = await loadData();
  state.all = d.items; state.demo = d.demo;
  applyHash();
})();
</script>
</body>
</html>
